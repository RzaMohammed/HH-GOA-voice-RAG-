[project]
name = "voice-rag"
version = "1.0.0"
description = "Voice-Enabled RAG System — HH Goa 2026 Shortlisting Task 2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HH Goa 2026 Candidate" }]

dependencies = [
    # --- Core ---
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "python-dotenv>=1.0",

    # --- Data ---
    "datasets>=2.18",
    "pandas>=2.0",

    # --- Embeddings & Vector Store ---
    "sentence-transformers>=2.6",
    "faiss-cpu>=1.7",
    "torch>=2.0",

    # --- Lexical Search ---
    "rank-bm25>=0.2",
    "nltk>=3.8",

    # --- Reranking ---
    "transformers>=4.40",

    # --- LLM Providers ---
    "google-generativeai>=0.8",
    "openai>=1.30",
    "groq>=0.9",

    # --- Voice / STT ---
    "httpx>=0.27",
    "aiofiles>=23.0",

    # --- API ---
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "python-multipart>=0.0.9",

    # --- Evaluation & Utilities ---
    "numpy>=1.24",
    "tqdm>=4.66",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
gpu = [
    "faiss-gpu>=1.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voice_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
